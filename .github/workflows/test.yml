name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  load-smoke:
    name: k6 smoke load test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start server
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000/health
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 (smoke profile)
        run: k6 run -e SMOKE=1 loadtest/k6-rooms.js
